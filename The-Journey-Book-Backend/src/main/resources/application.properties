spring.application.name=The-Journey-Book-Backend

# MongoDB Atlas Connection
spring.data.mongodb.uri=${MONGODB_ATLAS_URI}

# Server Port
server.port=8080

# Enable logging to debug
logging.level.org.springframework.data.mongodb=DEBUG

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Redirect URL after successful login - LOCAL DEVELOPMENT
#spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# Redirect URL after successful login - PRODUCTION (Comment when testing locally)
spring.security.oauth2.client.registration.google.redirect-uri=https://the-journey-book-backend.onrender.com/login/oauth2/code/google

# Google Places
google.api.key=${GOOGLE_PLACES_API_KEY}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_ID}
razorpay.key.secret=${RAZORPAY_SECRET}

# Frontend URL for OAuth2 success redirect - LOCAL
#frontend.oauth2.success-url=http://localhost:3000/oauth2-success

# Frontend URL for OAuth2 success redirect - PRODUCTION (Comment when testing locally)
frontend.oauth2.success-url=https://the-journey-book.netlify.app/oauth2-success